name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gdkpixbuf-2.0 python3-cryptography python3-av ffmpeg
      - name: Syntax check
        run: python3 -m compileall -q jpgs integration/nautilus tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
